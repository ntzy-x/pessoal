<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ntzy-x | Perfil GitHub</title>
    <!-- Fonte Inter do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .profile-card:hover {
            border-color: var(--text-muted);
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            object-fit: cover;
            background-color: var(--border-color);
        }

        .username {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 6px;
        }

        .handle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-box {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 600;
            color: #f0f6fc;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--accent-hover);
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 12px;
            border-radius: 6px;
            transition: background-color 0.2s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: #2ea043; /* Tom estilo GitHub Green para destaque ao visitar */
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <!-- Avatar oficial obtido do GitHub do perfil -->
            <img src="https://avatars.githubusercontent.com/u/295984833?s=200&v=4" alt="ntzy-x" class="avatar">
        </div>
        
        <h1 class="username">ntzy-x</h1>
        <div class="handle">@ntzy-x</div>
        
        <p class="bio">
            Desenvolvedor focado em projetos de código aberto e soluções tecnológicas.
        </p>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value">4</div>
                <div class="stat-label">Repositórios</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">GitHub</div>
                <div class="stat-label">Plataforma</div>
            </div>
        </div>

        <a href="https://github.com/ntzy-x" target="_blank" class="btn">Visitar Perfil no GitHub</a>
    </div>

</body>
</html>
